<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2B2R | Minecraft Server</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

<body>

<canvas id="bg"></canvas>

<div id="particles"></div>

<div class="background-glow"></div>

<div class="noise"></div>

<header>

<div class="logo-box">

<img
src="img/logo.png"
class="logo"
alt="2B2R Logo">

</div>

</header>

<main>

<div class="glass">

<h1>

2B2R

</h1>

<p class="subtitle">

ANARCHY MINECRAFT SERVER

</p>

<div class="cards">

<div class="card">

<div class="icon">

🌍

</div>

<h2>

Server IP

</h2>

<p id="ip">

policy-stuck.gl.joinmc.link

</p>

<button id="copy">

COPY IP

</button>

</div>

<div class="card">

<div class="icon">

🟢

</div>

<h2>

Status

</h2>

<p id="status">

ONLINE

</p>

</div>

<div class="card">

<div class="icon">

👥

</div>

<h2>

Players

</h2>

<p id="players">

0 / 500

</p>

</div>

</div>

<div class="welcome">

<h2>

Welcome to 2B2R

</h2>

<p>

Forge your own story.

Build without limits.

Survive everything.

There are no rules.

Only legends.

</p>

</div>

<div class="warning">

⚠ Server ping may be slightly higher depending on your location.

</div>

</div>

</main>

<script src="script.js"></script>

</body>

</html>
